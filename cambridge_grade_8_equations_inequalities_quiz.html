<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambridge Grade 8 - Equations & Inequalities Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
        }
        .option-card {
            transition: all 0.2s ease;
        }
        .option-card:hover:not(.disabled) {
            border-color: #6366f1;
            background-color: #f5f3ff;
        }
        .nav-btn-done {
            background-color: #4f46e5 !important;
            color: white !important;
        }
        .nav-btn-active {
            ring: 3px solid #f59e0b;
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-indigo-700 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="p-2 bg-indigo-600 rounded-lg">
                    <i class="fa-solid fa-graduation-cap text-yellow-300 text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg sm:text-xl">Interactive Mastery Quiz</h1>
                    <p class="text-xs text-indigo-200">Algebraic Equations & Inequalities (40 Questions)</p>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <div class="bg-indigo-800 px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-2">
                    <i class="fa-solid fa-trophy text-yellow-400"></i>
                    <span>Score: <span id="score-display">0</span> / 40</span>
                </div>
                <button onclick="resetQuiz()" class="text-xs bg-rose-600 hover:bg-rose-700 text-white px-3 py-1.5 rounded-lg font-medium transition flex items-center gap-1">
                    <i class="fa-solid fa-rotate-right"></i> Reset
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-6xl mx-auto px-4 py-6 flex-grow w-full grid md:grid-cols-12 gap-6">

        <!-- Question Navigation Panel (Left / Top on Mobile) -->
        <aside class="md:col-span-4 lg:col-span-3 space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 sticky top-20">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="font-bold text-slate-800 text-sm flex items-center gap-2">
                        <i class="fa-solid fa-list-check text-indigo-600"></i> Question Navigator
                    </h2>
                    <span id="progress-text" class="text-xs text-slate-500 font-medium">0/40 Done</span>
                </div>

                <!-- Progress Bar -->
                <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden mb-4">
                    <div id="progress-bar" class="bg-indigo-600 h-full w-0 transition-all duration-300"></div>
                </div>

                <!-- Legend -->
                <div class="flex text-[11px] justify-between mb-3 text-slate-500 font-medium border-b border-slate-100 pb-2">
                    <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-indigo-600"></span> Answered</span>
                    <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-slate-200"></span> Unanswered</span>
                </div>

                <!-- Question Grid -->
                <div id="question-grid" class="grid grid-cols-5 gap-2 max-h-[360px] overflow-y-auto pr-1">
                    <!-- Dynamic Grid Buttons generated by JS -->
                </div>
            </div>
        </aside>

        <!-- Main Question Card Area -->
        <section class="md:col-span-8 lg:col-span-9 space-y-4">
            <div id="question-card" class="bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-slate-200 space-y-6">
                
                <!-- Question Header / Difficulty Badge -->
                <div class="flex justify-between items-center border-b border-slate-100 pb-4">
                    <span id="q-number" class="text-xs font-bold px-3 py-1 bg-indigo-100 text-indigo-700 rounded-full">Question 1 of 40</span>
                    <span id="q-level" class="text-xs font-semibold px-2.5 py-1 bg-slate-100 text-slate-600 rounded-md">Easy</span>
                </div>

                <!-- Question Text -->
                <div class="space-y-2">
                    <h3 id="q-text" class="text-lg sm:text-xl font-bold text-slate-800 leading-snug">
                        <!-- Loaded by JS -->
                    </h3>
                </div>

                <!-- Options List -->
                <div id="options-container" class="space-y-3 pt-2">
                    <!-- Loaded by JS -->
                </div>

                <!-- Feedback Box -->
                <div id="feedback-box" class="hidden p-4 rounded-xl border space-y-2 text-sm">
                    <!-- Loaded by JS -->
                </div>

                <!-- Next/Prev Control Buttons -->
                <div class="flex justify-between items-center border-t border-slate-100 pt-5">
                    <button id="prev-btn" onclick="navigateQuestion(-1)" class="px-4 py-2 bg-slate-100 text-slate-700 hover:bg-slate-200 rounded-xl text-sm font-bold flex items-center gap-2 transition">
                        <i class="fa-solid fa-arrow-left"></i> Previous
                    </button>
                    
                    <button id="next-btn" onclick="navigateQuestion(1)" class="px-5 py-2 bg-indigo-600 text-white hover:bg-indigo-700 rounded-xl text-sm font-bold flex items-center gap-2 transition shadow-md">
                        Next <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
            </div>
        </section>

    </main>

    <script>
        const questions = [
            // EASY (1-10) - Direct Equations & Inequalities Solving
            {
                id: 1, level: "Easy",
                q: "Solve for \\(x\\): \\(x + 9 = 21\\)",
                options: ["\\(x = 12\\)", "\\(x = 30\\)", "\\(x = 11\\)", "\\(x = 13\\)"],
                correct: 0,

            },
            {
                id: 2, level: "Easy",
                q: "Solve for \\(y\\): \\(y - 14 = 8\\)",
                options: ["\\(y = 6\\)", "\\(y = 22\\)", "\\(y = 112\\)", "\\(y = 24\\)"],
                correct: 1,
                exp: "Add 14 to both sides: \\(y = 8 + 14 = 22\\)."
            },
            {

            {

            {

            {

            },
            {
                id: 8, level: "Easy",
                q: "Solve the inequality: \\(\\frac{n}{2} > 8\\)",

            },
            {
                id: 9, level: "Easy",
                q: "Solve for \\(w\\): \\(w + 15 = 3\\)",

                correct: 1,
                exp: "Subtract 15 from both sides: \\(w = 3 - 15 = -12\\)."

            {

                options: ["\\(a = 7\\)", "\\(a = 4\\)", "\\(a = 8\\)", "\\(a = 14\\)"],

            // MEDIUM (11-25) - Multi-step & Sign Flipping
            {
                id: 11, level: "Medium",
                q: "Solve for \\(x\\): \\(4x - 7 = 17\\)",
                options: ["\\(x = 2.5\\)", "\\(x = 5\\)", "\\(x = 6\\)", "\\(x = 24\\)"],

            },
            {
                id: 12, level: "Medium",
                q: "Solve for \\(p\\): \\(3(p + 4) = 27\\)",
                options: ["\\(p = 5\\)", "\\(p = 9\\)", "\\(p = 11\\)", "\\(p = 15\\)"],
                correct: 0,
                exp: "Expand brackets: \\(3p + 12 = 27\\). Subtract 12: \\(3p = 15\\). Divide by 3: \\(p = 5\\)."
            },
            {
                id: 13, level: "Medium",
                q: "Solve for \\(w\\): \\(5w - 3 = 2w + 12\\)",

            {

                correct: 1,

            },
            {
                id: 15, level: "Medium",
                q: "Solve the inequality: \\(12 - 3x \\ge 3\\)",
                options: ["\\(x \\ge 3\\)", "\\(x \\le -3\\)", "\\(x \\le 3\\)", "\\(x \\ge -3\\)"],
                correct: 2,

            },
            {
                id: 16, level: "Medium",
                q: "Solve for \\(n\\): \\(\\frac{n + 6}{3} = 7\\)",
                options: ["\\(n = 15\\)", "\\(n = 27\\)", "\\(n = 13\\)", "\\(n = 21\\)"],

            },
            {
                id: 17, level: "Medium",
                q: "Solve for \\(z\\): \\(2(3z - 1) = 4z + 8\\)",
                options: ["\\(z = 3\\)", "\\(z = 4\\)", "\\(z = 5\\)", "\\(z = 10\\)"],
                correct: 2,
                exp: "Expand: \\(6z - 2 = 4z + 8\\). Subtract \\(4z\\): \\(2z - 2 = 8\\). Add 2: \\(2z = 10\\) \\(\\Rightarrow z = 5\\)."

            {
                id: 18, level: "Medium",
                q: "Solve the inequality: \\(4(y - 2) \\le 2y + 6\\)",

            },
            {
                id: 19, level: "Medium",
                q: "Solve the equation: \\(5n - 8 = 22\\)",
                options: ["\\(n = 6\\)", "\\(n = 5\\)", "\\(n = 4\\)", "\\(n = 7\\)"],

            {

                correct: 2,
                exp: "Multiply both sides by 4: \\(x \\ge 15 \\times 4 \\Rightarrow x \\ge 60\\)."
            },
            {
                id: 21, level: "Medium",
                q: "Solve for \\(x\\): \\(7 - x = 15\\)",
                options: ["\\(x = 8\\)", "\\(x = -8\\)", "\\(x = 22\\)", "\\(x = -22\\)"],
                correct: 1,
                exp: "Subtract 7: \\(-x = 8\\). Divide by -1: \\(x = -8\\)."
            },
            {
                id: 22, level: "Medium",
                q: "Solve the inequality: \\(5 - 2k > 13\\)",
                options: ["\\(k > -4\\)", "\\(k < -4\\)", "\\(k < 4\\)", "\\(k > 4\\)"],
                correct: 1,
                exp: "Subtract 5: \\(-2k > 8\\). Divide by -2 and flip sign: \\(k < -4\\)."
            },
            {
                id: 23, level: "Medium",
                q: "Solve for \\(t\\): \\(\\frac{2t - 4}{3} = 6\\)",
                options: ["\\(t = 11\\)", "\\(t = 7\\)", "\\(t = 22\\)", "\\(t = 10\\)"],
                correct: 0,
                exp: "Multiply by 3: \\(2t - 4 = 18\\). Add 4: \\(2t = 22\\). Divide by 2: \\(t = 11\\)."
            },
            {
                id: 24, level: "Medium",
                q: "Solve for \\(x\\): \\(-4(x - 3) = 16\\)",
                options: ["\\(x = -1\\)", "\\(x = 7\\)", "\\(x = 1\\)", "\\(x = -7\\)"],
                correct: 0,
                exp: "Divide by -4: \\(x - 3 = -4\\). Add 3: \\(x = -1\\)."
            },
            {
                id: 25, level: "Medium",
                q: "Solve for \\(b\\): \\(8b + 4 = 3b - 11\\)",
                options: ["\\(b = -3\\)", "\\(b = 3\\)", "\\(b = -15\\)", "\\(b = -1.4\\)"],
                correct: 0,
                exp: "Subtract \\(3b\\): \\(5b + 4 = -11\\). Subtract 4: \\(5b = -15\\) \\(\\Rightarrow b = -3\\)."
            },

            // HARD (26-40) - Complex Word Problems & Applied Scenarios
            {
                id: 26, level: "Hard",
                q: "Tom is 4 years older than twice his sister's age \\(s\\). If Tom is 18 years old, find his sister's age.",
                options: ["7 years old", "8 years old", "9 years old", "10 years old"],
                correct: 0,
                exp: "Form the equation: \\(2s + 4 = 18\\). Subtract 4: \\(2s = 14\\). Divide by 2: \\(s = 7\\) years old."
            },
            {
                id: 27, level: "Hard",
                q: "Maya has $60. She buys a jacket for $25 and wants to buy T-shirts costing $7 each. What is the maximum number of T-shirts \\(t\\) she can buy?",
                options: ["4 T-shirts", "5 T-shirts", "6 T-shirts", "7 T-shirts"],
                correct: 1,
                exp: "Form the inequality: \\(7t + 25 \\le 60\\). Subtract 25: \\(7t \\le 35\\). Divide by 7: \\(t \\le 5\\). Maximum 5 T-shirts."
            },
            {
                id: 28, level: "Hard",
                q: "The sum of three consecutive integers is 51. What is the largest integer among them?",
                options: ["16", "17", "18", "19"],
                correct: 2,
                exp: "Let integers be \\(x, x+1, x+2\\). Equation: \\(x + (x+1) + (x+2) = 51 \\Rightarrow 3x + 3 = 51 \\Rightarrow 3x = 48 \\Rightarrow x = 16\\). The largest integer is \\(16 + 2 = 18\\)."
            },
            {
                id: 29, level: "Hard",
                q: "A taxi driver charges a flat fee of $3.50 plus $1.50 per mile \\(m\\). If the total fare for a trip was $18.50, find the total distance driven.",
                options: ["8 miles", "10 miles", "12 miles", "14 miles"],
                correct: 1,
                exp: "Form the equation: \\(1.50m + 3.50 = 18.50 \\Rightarrow 1.50m = 15.00 \\Rightarrow m = 10\\) miles."
            },
            {

                q: "Gym A charges a joining fee of $40 plus $15 per month. Gym B charges $25 per month with no joining fee. After how many months \\(m\\) will the total cost for both gyms be equal?",

                correct: 1,
                exp: "Form the equation: \\(15m + 40 = 25m\\). Subtract \\(15m\\): \\(10m = 40 \\Rightarrow m = 4\\) months."
            },
            {
                id: 31, level: "Hard",
                q: "Solve for \\(x\\): \\(\\frac{3(x - 2)}{4} = 6\\)",
                options: ["\\(x = 8\\)", "\\(x = 10\\)", "\\(x = 12\\)", "\\(x = 14\\)"],
                correct: 1,
                exp: "Multiply by 4: \\(3(x - 2) = 24\\). Divide by 3: \\(x - 2 = 8\\). Add 2: \\(x = 10\\)."
            },
            {
                id: 32, level: "Hard",
                q: "An elevator has a maximum weight capacity of 800 kg. A group of people weighing a total of 350 kg enter the elevator. What is the maximum number of 45 kg boxes \\(b\\) that can be loaded alongside them?",
                options: ["At most 9 boxes", "At most 10 boxes", "At most 11 boxes", "At most 12 boxes"],
                correct: 1,
                exp: "Form the inequality: \\(45b + 350 \\le 800 \\Rightarrow 45b \\le 450 \\Rightarrow b \\le 10\\) boxes."
            },
            {
                id: 33, level: "Hard",
                q: "The perimeter of a rectangle is 46 cm. If the length is 3 cm longer than its width, find the length of the rectangle.",
                options: ["10 cm", "13 cm", "15 cm", "20 cm"],
                correct: 1,
                exp: "Let width = \\(w\\) and length = \\(w + 3\\). Perimeter = \\(2(w + 3) + 2w = 46 \\Rightarrow 4w + 6 = 46 \\Rightarrow 4w = 40 \\Rightarrow w = 10\\) cm. Length = \\(10 + 3 = 13\\) cm."
            },
            {
                id: 34, level: "Hard",
                q: "Solve the inequality: \\(-3(2x - 4) < 18\\)",
                options: ["\\(x > -1\\)", "\\(x < -1\\)", "\\(x > 1\\)", "\\(x < 1\\)"],
                correct: 0,
                exp: "Expand: \\(-6x + 12 < 18 \\Rightarrow -6x < 6\\). Divide by -6 and flip sign: \\(x > -1\\)."

                q: "Alex needs an average score of at least 80 on 4 tests to pass his course. His first 3 test scores are 75, 82, and 78. What is the minimum score \\(s\\) he needs on the 4th test?",

            },
            {
                id: 38, level: "Hard",
                q: "Solve for \\(y\\): \\(\\frac{y}{2} - \\frac{y}{3} = 4\\)",

                q: "Sam is twice as old as Ben. In 6 years, the sum of their ages will be 39. How old is Ben currently?",
                options: ["7 years old", "9 years old", "12 years old", "14 years old"],
                correct: 1,
                exp: "Let Ben's current age = \\(b\\), Sam's age = \\(2b\\). In 6 years: \\((b + 6) + (2b + 6) = 39 \\Rightarrow 3b + 12 = 39 \\Rightarrow 3b = 27 \\Rightarrow b = 9\\) years old."
            },
            {
                id: 40, level: "Hard",
                q: "Solve the inequality: \\(\\frac{5 - 2x}{3} \\ge -1\\)",
                options: ["\\(x \\le 4\\)", "\\(x \\ge 4\\)", "\\(x \\le -1\\)", "\\(x \\ge -1\\)"],
                correct: 0,
                exp: "Multiply by 3: \\(5 - 2x \\ge -3\\). Subtract 5: \\(-2x \\ge -8\\). Divide by -2 and flip sign: \\(x \\le 4\\)."
            }
        ];

        let currentQIndex = 0;
        let userAnswers = {};

        // Load saved answers from LocalStorage
        function loadState() {
            const saved = localStorage.getItem("cambridge_math_quiz_answers");
            if (saved) {
                try {
                    userAnswers = JSON.parse(saved);
                } catch (e) {
                    userAnswers = {};
                }
            }
        }

        // Save state
        function saveState() {
            localStorage.setItem("cambridge_math_quiz_answers", JSON.stringify(userAnswers));
        }

        // Initialize App
        function initQuiz() {
            loadState();
            renderGrid();
            loadQuestion(currentQIndex);
            updateScoreAndProgress();
        }

        // Render Sidebar Navigator Grid
        function renderGrid() {
            const gridEl = document.getElementById("question-grid");
            gridEl.innerHTML = "";

            questions.forEach((q, idx) => {
                const btn = document.createElement("button");
                btn.className = `h-9 w-full rounded-lg text-xs font-bold transition flex items-center justify-center border ${
                    idx === currentQIndex ? 'border-amber-500 ring-2 ring-amber-400' : 'border-slate-200'
                }`;

                if (userAnswers[idx] !== undefined) {
                    btn.classList.add("nav-btn-done");
                    btn.innerHTML = `<i class="fa-solid fa-check text-[10px] mr-0.5"></i> ${idx + 1}`;
                } else {
                    btn.classList.add("bg-slate-50", "text-slate-700", "hover:bg-slate-100");
                    btn.innerText = idx + 1;
                }

                btn.onclick = () => jumpToQuestion(idx);
                gridEl.appendChild(btn);
            });
        }

        // Load Single Question Card
        function loadQuestion(index) {
            currentQIndex = index;
            const q = questions[index];

            document.getElementById("q-number").innerText = `Question ${index + 1} of 40`;
            
            // Set Difficulty Badge Color
            const levelEl = document.getElementById("q-level");
            levelEl.innerText = q.level;
            if (q.level === "Easy") {
                levelEl.className = "text-xs font-semibold px-2.5 py-1 bg-emerald-100 text-emerald-800 rounded-md";
            } else if (q.level === "Medium") {
                levelEl.className = "text-xs font-semibold px-2.5 py-1 bg-amber-100 text-amber-800 rounded-md";
            } else {
                levelEl.className = "text-xs font-semibold px-2.5 py-1 bg-rose-100 text-rose-800 rounded-md";
            }

            document.getElementById("q-text").innerHTML = q.q;

            const optionsContainer = document.getElementById("options-container");
            optionsContainer.innerHTML = "";

            const answered = userAnswers[index] !== undefined;
            const selectedOpt = userAnswers[index];

            q.options.forEach((optText, optIdx) => {
                const optBtn = document.createElement("button");
                let btnClasses = "option-card w-full p-4 rounded-xl border text-left text-sm font-medium flex items-center justify-between transition ";

                if (!answered) {
                    btnClasses += "border-slate-200 bg-white hover:border-indigo-400";
                } else {
                    btnClasses += "disabled cursor-default ";
                    if (optIdx === q.correct) {
                        btnClasses += "border-emerald-500 bg-emerald-50 text-emerald-900 font-bold";
                    } else if (optIdx === selectedOpt) {
                        btnClasses += "border-rose-500 bg-rose-50 text-rose-900";
                    } else {
                        btnClasses += "border-slate-200 bg-slate-50 text-slate-400 opacity-60";
                    }
                }

                optBtn.className = btnClasses;
                
                let iconHtml = "";
                if (answered) {
                    if (optIdx === q.correct) {
                        iconHtml = `<i class="fa-solid fa-circle-check text-emerald-600 text-lg"></i>`;
                    } else if (optIdx === selectedOpt) {
                        iconHtml = `<i class="fa-solid fa-circle-xmark text-rose-600 text-lg"></i>`;
                    }
                }

                optBtn.innerHTML = `<span><span class="font-bold text-slate-400 mr-2">${String.fromCharCode(65 + optIdx)})</span> ${optText}</span> ${iconHtml}`;
                
                if (!answered) {
                    optBtn.onclick = () => selectAnswer(optIdx);
                }

                optionsContainer.appendChild(optBtn);
            });

            // Feedback Box Handling
            const feedbackBox = document.getElementById("feedback-box");
            if (answered) {
                feedbackBox.classList.remove("hidden", "bg-emerald-50", "border-emerald-200", "text-emerald-900", "bg-rose-50", "border-rose-200", "text-rose-900");
                if (selectedOpt === q.correct) {
                    feedbackBox.classList.add("bg-emerald-50", "border-emerald-200", "text-emerald-900");
                    feedbackBox.innerHTML = `
                        <div class="font-bold flex items-center gap-2 text-emerald-700">
                            <i class="fa-solid fa-circle-check"></i> Correct Answer!
                        </div>
                        <div>${q.exp}</div>
                    `;
                } else {
                    feedbackBox.classList.add("bg-rose-50", "border-rose-200", "text-rose-900");
                    feedbackBox.innerHTML = `
                        <div class="font-bold flex items-center gap-2 text-rose-700">
                            <i class="fa-solid fa-circle-xmark"></i> Incorrect Solution
                        </div>
                        <div>${q.exp}</div>
                    `;
                }
            } else {
                feedbackBox.classList.add("hidden");
            }

            // Update Nav Buttons
            document.getElementById("prev-btn").disabled = index === 0;
            document.getElementById("prev-btn").classList.toggle("opacity-50", index === 0);

            document.getElementById("next-btn").innerText = index === questions.length - 1 ? "Finish" : "Next";

            renderGrid();

            // Re-render MathJax formula typesetting
            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise([document.getElementById("question-card")]);
            }
        }

        // Handle Selecting Answer
        function selectAnswer(optIdx) {
            if (userAnswers[currentQIndex] !== undefined) return;

            userAnswers[currentQIndex] = optIdx;
            saveState();
            updateScoreAndProgress();
            loadQuestion(currentQIndex);
        }

        // Jump directly to a question
        function jumpToQuestion(idx) {
            loadQuestion(idx);
        }

        // Previous / Next Buttons
        function navigateQuestion(direction) {
            const newIdx = currentQIndex + direction;
            if (newIdx >= 0 && newIdx < questions.length) {
                loadQuestion(newIdx);
            }
        }

        // Calculate and Update Header Statistics
        function updateScoreAndProgress() {
            let score = 0;
            let totalAnswered = 0;

            Object.keys(userAnswers).forEach(idx => {
                totalAnswered++;
                if (userAnswers[idx] === questions[idx].correct) {
                    score++;
                }
            });

            document.getElementById("score-display").innerText = score;
            document.getElementById("progress-text").innerText = `${totalAnswered}/40 Done`;
            
            const progressPercent = (totalAnswered / questions.length) * 100;
            document.getElementById("progress-bar").style.width = `${progressPercent}%`;
        }

        // Reset All Answers
        function resetQuiz() {
            // Using inline UI state reset without modal browser alerts
            localStorage.removeItem("cambridge_math_quiz_answers");
            userAnswers = {};
            currentQIndex = 0;
            initQuiz();
        }

        // Startup
        window.onload = initQuiz;
    </script>
</body>
</html>
